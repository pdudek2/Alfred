name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:quality

  electron-smoke:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The launcher installer test runs only on macOS; the Linux quality job skips it.
      - run: pnpm test:scripts
      - run: pnpm --filter @alfred/desktop... build
      - run: pnpm smoke:electron
      - name: Upload Electron diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-smoke-diagnostics
          path: |
            output/playwright
          if-no-files-found: warn
          retention-days: 7

  electron-smoke-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth dbus-daemon libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      # Ubuntu 24.04 confines unprivileged user namespaces, and Chromium's sandbox needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alfred/desktop... build
      - run: dbus-run-session -- xvfb-run -a pnpm smoke:electron
      - name: Upload Electron diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-smoke-linux-diagnostics
          path: |
            output/playwright
          if-no-files-found: warn
          retention-days: 7

  windows-path-security:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alfred/desktop exec vitest run src/main/workspace-path.test.ts
